<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1><b>Rock-Paper-Scissor</b></h1>
    <div class="choices">
      <div> <img class="choice" id="rock" src="1.jpg" alt="Rock"></div> 
       <div><img class="choice" id="scissor" src="2.jpg" alt="Paper"></div> 
       <div><img class="choice" id="paper" src="3.png" alt="Scissor"></div> 
    </div>
    <div class="score">
        <div class="myScore">
            <p id="userscor">0</p>
            <p class="user">YOU</p>
        </div>
        <div class="comScore">
            <p id="comscor">0</p>
            <p class="comp">COMPUTER</p>
        </div>    
    </div>
    <div class="msgboard">
        <div class="msg">lets Begin!</div>
    </div>
    <button class="reset">Reset Game</button>
    <script src="app.js"></script>
</body>
</html>
